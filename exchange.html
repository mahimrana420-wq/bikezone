<!DOCTYPE html>
<html>
<head>
    <title>Bike Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏍 BikeZone BD</a>
        <a href="bikes.html" class="btn btn-outline-light">Bikes</a>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center">Exchange Your Bike</h1>
    <p class="text-center">Want to buy a new bike? Exchange your old bike with us.</p>

    <form class="exchange">

        <input class="form-control mb-3" placeholder="Your Name">

        <input class="form-control mb-3" placeholder="Phone Number">

        <input class="form-control mb-3" placeholder="Old Bike Model">

        <input class="form-control mb-3" placeholder="Bike Model Year">

        <input class="form-control mb-3" placeholder="Expected Price">

        <textarea class="form-control mb-3"
        placeholder="Additional Information"></textarea>

        <button class="btn btn-warning">Submit Request</button>

    </form>

</div>

<footer>
    <p>© 2026 BikeZone BD</p>
</footer>

</body>
</html>
