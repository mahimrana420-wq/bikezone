<!DOCTYPE html>
<html>
<head>
    <title>Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏍 BikeZone BD</a>
        <a href="index.html" class="btn btn-outline-light">Home</a>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center">Our Services</h1>

    <div class="row text-center mt-4">

        <div class="col-md-4">
            <div class="service">
                <h3>🔧 Bike Servicing</h3>
                <p>Complete bike servicing and maintenance.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="service">
                <h3>🛞 Tyre Service</h3>
                <p>Tyre checking and replacement service.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="service">
                <h3>🛠 Engine Service</h3>
                <p>Professional engine inspection and repair.</p>
            </div>
        </div>

    </div>

    <h3 class="mt-5">Book a Service</h3>

    <form>
        <input class="form-control mb-3" placeholder="Your Name">
        <input class="form-control mb-3" placeholder="Phone Number">
        <input class="form-control mb-3" placeholder="Bike Model">

        <select class="form-control mb-3">
            <option>Select Service</option>
            <option>Bike Servicing</option>
            <option>Tyre Service</option>
            <option>Engine Service</option>
        </select>

        <button class="btn btn-dark">Book Service</button>
    </form>

</div>

<footer>
    <p>© 2026 BikeZone BD</p>
</footer>

</body>
</html>
